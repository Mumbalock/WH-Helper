# Mise à jour quotidienne de WH Helper depuis les guides Wowhead, faite par GitHub.
# Le programme ne télécharge les guides que si Wowhead a publié du nouveau, puis les
# fichiers régénérés sont enregistrés dans le dépôt. Les PC récupèrent ensuite l'addon
# avec « whhelper_maj.py --depuis-github » (voir MiseAJour/installer_auto.bat).
name: Mise à jour depuis Wowhead

on:
  schedule:
    - cron: "0 4 * * *"      # tous les jours à 4h UTC (5h en hiver, 6h en été à Paris)
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
    inputs:
      force:
        description: "Mettre à jour même si Wowhead n'a rien changé"
        type: boolean
        default: false
  push:                       # quand ce fichier est modifié : lancement de test (mise à jour forcée)
    branches: [main]
    paths: [.github/workflows/maj.yml]

permissions:
  contents: write

concurrency:
  group: maj-wowhead
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Paris        # dates « majLe » à l'heure française
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Icônes déjà téléchargées (dossier ignoré par git) : gardées d'un jour à l'autre.
      - name: Cache des icônes
        uses: actions/cache@v4
        with:
          path: Simulateur/icones
          key: icones-${{ github.run_id }}
          restore-keys: icones-

      - name: Lecture de Wowhead
        run: python MiseAJour/whhelper_maj.py --sans-copie ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }}

      - name: Enregistrement dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Fichiers régénérés + état de la dernière mise à jour (gardé d'un jour à l'autre).
          git add WHHelper/Data Simulateur/simulateur.html MiseAJour/etat.json MiseAJour/derniers_guides.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Mise à jour automatique depuis Wowhead ($(date '+%Y-%m-%d %H:%M'))"
            git push
          fi
